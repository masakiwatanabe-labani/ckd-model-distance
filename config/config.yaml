external:
  gse_mouse_iri: GSE98622
  # GSE98622 は2つのシーケンスプラットフォームに分かれている（series matrix で確認）:
  #   GPL13112: SHAM4h/24h/12m, IRI2h..IRI28d, IRI12m
  #   GPL19057: NORM3m/9m/15m, IRI6mN
  # プラットフォームをまたいで対照をプールすると batch と交絡するため、
  # 必ず同一プラットフォーム内・時点整合のコントラストを組む。
  # 主解析: 12か月 IRI vs 同週齢 sham（同一プラットフォーム、加齢も揃う）
  iri_late_labels: [IRI12m]
  iri_control_labels: [SHAM12m]
  # 感度解析: 6か月 IRI vs 同一プラットフォームの normal
  iri_late_labels_sens: [IRI6mN]
  iri_control_labels_sens: [NORM3m, NORM9m, NORM15m]
  kpmp_proteomics: data/external/KPMP/regional_proteomics.csv
  kpmp_transcriptomics: data/external/KPMP/regional_transcriptomics.csv

design:
  # 種 x 発症区画（入口）。マウスだけが両方の入口を持つ点が設計の要。
  cat_natural_ctx:  {species: cat,   entry: tubular}
  cat_natural_med:  {species: cat,   entry: tubular}
  mouse_podtreck:   {species: mouse, entry: glomerular}
  mouse_iri_late:   {species: mouse, entry: tubular}
  human_kpmp_ti:    {species: human, entry: glomerular}
  human_kpmp_g:     {species: human, entry: glomerular}
